name: Release Conversor WAV

# Publica uma nova versão do app ao subir uma tag vX.Y.Z.
# O app instalado confere a última release do GitHub ao abrir e se atualiza sozinho.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: conversor-wav-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conversor-wav-app/package-lock.json

      - name: Conferir se a tag bate com a versão do package.json
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão do package.json ($v)"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: Gerar o instalador e publicar a release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
