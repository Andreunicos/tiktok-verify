name: BigLoop AutoClips — publicar versão

# Cada mudança no app gera uma versão nova (0.3.<número da execução>) e publica o instalador
# no GitHub Releases. O app instalado verifica essa página ao abrir e se atualiza sozinho.
# Só publica se o typecheck e TODOS os testes passarem no Windows.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['BigLoop-AutoClips/**', '.github/workflows/bigloop-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bigloop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: BigLoop-AutoClips
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BigLoop-AutoClips/package-lock.json
      - name: FFmpeg (para os testes)
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Definir versão
        shell: bash
        run: npm version "0.3.${{ github.run_number }}" --no-git-tag-version
      # A release é criada ANTES como rascunho: o electron-builder envia os arquivos em paralelo e,
      # sem uma release existente, cada envio criava a sua (releases duplicadas).
      - name: Criar etiqueta e release (rascunho)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v0.3.${{ github.run_number }}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --draft --title "BigLoop AutoClips $tag" --notes "Versão automática gerada a partir de ${GITHUB_SHA::7}. O app instalado se atualiza sozinho."
      - name: Construir instalador e enviar para a release
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publicar a release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v0.3.${{ github.run_number }}"
          assets=$(gh release view "$tag" --json assets --jq '[.assets[].name] | join(" ")')
          echo "Arquivos: $assets"
          for f in latest.yml .exe .exe.blockmap; do [[ "$assets" == *"$f"* ]] || { echo "Faltou $f"; exit 1; }; done
          gh release edit "$tag" --draft=false --latest
      - name: Limpar releases sem instalador (sobras de execuções anteriores)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select((.assets | map(.name | endswith(".exe")) | any) | not) | .id' |
          while read -r id; do echo "Apagando release $id"; gh api -X DELETE "repos/${{ github.repository }}/releases/$id"; done
